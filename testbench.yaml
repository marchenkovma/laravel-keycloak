laravel: '@testbench'

# Мини-приложение для ручной проверки пакета: composer serve.
# Настройки Keycloak в workbench/.env (образец: workbench/.env.example)
providers:
  - Laravel\Socialite\SocialiteServiceProvider
  - SocialiteProviders\Manager\ServiceProvider
  - Marchenkovma\LaravelKeycloak\KeycloakServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  # false: без стандартных миграций Testbench, users у workbench свой
  install: false
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
